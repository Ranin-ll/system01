function videoPane(){return `<div class="learning-list">${state.materials.filter(m=>m.type==='视频实操').map(m=>`<div class="learning-row"><span>视频</span><div><b>${m.chapter}</b><div class="sub">${m.title} · 当前进度 ${m.progress}%</div></div><button class="btn small light" onclick="openMaterialPage('${m.id}')">去观看</button></div>`).join('')}</div>`}
function learning(){let rows=state.materials.map(m=>`<tr><td><b>${m.title}</b><div class="sub">${m.chapter}</div></td><td>${m.type}</td><td><div class="progress"><i style="width:${m.progress}%"></i></div><div class="sub">${m.progress}%</div></td><td>${m.done?'<span class="tag green">已完成</span>':'<span class="tag amber">学习中</span>'}</td><td>${m.doneAt||'-'}</td><td><button class="btn small light" onclick="openMaterialPage('${m.id}')">打开</button></td></tr>`).join('');return shell('学习材料','文档理论和视频实操分开管理，完成状态会写回正式考核资格',`<div class="stats">${stat('文档理论',state.materials.filter(x=>x.type==='文档理论'&&x.done).length+'/'+state.materials.filter(x=>x.type==='文档理论').length,'滚动到底验证')}${stat('视频实操',state.materials.filter(x=>x.type==='视频实操'&&x.done).length+'/'+state.materials.filter(x=>x.type==='视频实操').length,'观看进度验证')}${stat('当前完成率',currentStudent().courseRate+'%','回写工作台')}${stat('考核资格',currentStudent().courseRate>=state.settings.examThreshold?'满足':'继续学习','部门规则',currentStudent().courseRate>=state.settings.examThreshold?'':'warn')}</div><div class="table-wrap"><table class="table"><thead><tr><th>材料</th><th>类型</th><th>进度</th><th>状态</th><th>完成时间</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div>`)}
function openMaterial(id){let m=state.materials.find(x=>x.id===id);let isDoc=m.type==='文档理论';openModal(m.title,`<div class="grid-2"><div><div class="reader"><h3>${m.title}</h3><p>这里模拟学习正文。实际系统中接入文档预览、阅读进度、完成时间和审计日志。</p><p>文档理论材料必须阅读到末尾后才能完成，视频实操材料需要记录播放进度。</p><p>本段位于末尾。点击下方按钮模拟通过完成验证。</p></div><div class="sub" style="margin-top:10px" id="materialTip">${isDoc?'请滚动到文档末尾。':'请观看到要求进度。'}</div></div><div class="card"><h3>完成规则</h3>${kpi('当前进度',m.progress)}<p class="muted">${isDoc?'文档完成验证：必须滚动到底。':'视频完成验证：观看进度达到 '+state.settings.videoPercentRequired+'%。'}</p></div></div>`,`${isDoc?`<button class="btn" onclick="passMaterialCheck('${id}')">模拟已滚动到底</button>`:`<button class="btn" onclick="passMaterialCheck('${id}')">模拟观看完成</button>`}<button class="btn primary" id="finishBtn" ${m.progress>=100?'':'disabled'} onclick="finishMaterial('${id}')">标记完成</button>`)}
function passMaterialCheck(id){let m=state.materials.find(x=>x.id===id);m.progress=100;document.getElementById('finishBtn').disabled=false;document.getElementById('materialTip').textContent='完成验证已通过，可以标记完成。';save();toast('完成验证已通过')}
function finishMaterial(id){let m=state.materials.find(x=>x.id===id);m.done=true;m.progress=100;m.doneAt=now();recalcCourseRate();audit(roleUser[role],'完成学习材料',m.title);closeModal();render();toast('学习材料已完成')}
function recalcCourseRate(){let done=state.materials.filter(x=>x.done).length;currentStudent().courseRate=Math.round(done/state.materials.length*100)}
function exam(){let s=currentStudent();let can=s.courseRate>=state.settings.examThreshold;return shell('正式考核','理论考试与实践考核分开统计，结果统一回写成绩模块',`<div class="stats">${stat('参加条件',can?'满足':'继续学习',`学习完成率 ${s.courseRate}% / ${state.settings.examThreshold}%`,can?'':'warn')}${stat('理论考试',s.theory,'限时自动交卷')}${stat('实践考核',s.practice,'上传成果')}${stat('补考次数','0 / '+state.settings.retakeLimit,'部门规则')}</div><div class="grid-2"><div class="exam-card panel"><div class="exam-card-head"><div><h2>理论考试</h2><p class="muted">进入后模拟答题和提交，提交后状态改为待评分。</p></div><button class="btn primary" ${can?'':'disabled'} onclick="startTheory()">进入理论考试</button></div></div><div class="exam-card panel"><div class="exam-card-head"><div><h2>实践考核</h2><p class="muted">上传实践成果后进入部门管理员批阅队列。</p></div><button class="btn primary" ${can?'':'disabled'} onclick="submitPractice()">提交实践成果</button></div></div></div><div class="card section"><h3>规则提示</h3><p class="muted">${can?'已满足正式考核条件，可以参加理论考试并提交实践成果。':'当前继续完成学习材料，达到部门规则后开放正式考核入口。'}</p></div>`)}
function startTheory(){go('theoryExam')}
function theoryExamPage(){let s=currentStudent();let can=s.courseRate>=state.settings.examThreshold;if(!can)return shell('正式理论考试',`当前学习完成率 ${s.courseRate}%，达到 ${state.settings.examThreshold}% 后开放正式理论考试`,`<div class="card"><p class="muted">请先完成学习材料，完成后考试入口自动开放。</p><button class="btn light" style="margin-top:12px" onclick="go('learning')">前往学习材料</button></div>`);return shell('正式理论考试','线上限时答题 · 随机抽取 10 题 · 交卷后进入部门管理员评分',`<div class="grid-2"><div><div class="card"><h3>1. 以下哪项属于正式考核提交后的状态？</h3><p><label><input type="radio" name="q1" checked> 待评分</label></p><p><label><input type="radio" name="q1"> 已归档</label></p></div><div class="card" style="margin-top:12px"><h3>2. 学习完成率会影响什么？</h3><p><label><input type="radio" name="q2" checked> 正式考核参加资格</label></p></div><div class="card" style="margin-top:12px"><h3>3. 实践考核的评分方式是什么？</h3><p><label><input type="radio" name="q3" checked> AI 初筛 + 人工复核</label></p></div></div><div><div class="card"><h3>答题卡</h3><div class="answer-sheet">${Array.from({length:10},(_,i)=>`<span class="${i<3?'done':''}">${i+1}</span>`).join('')}</div><p class="muted" style="margin-top:12px">考试时长 120 分钟，通过分数 ${state.settings.passScore} / 100，交卷后进入待评分状态，成绩由部门管理员发布。</p></div></div></div>`,`<button class="btn" onclick="go('exam')">返回考核</button><button class="btn primary" onclick="submitTheory()">交卷</button>`)}
function submitTheory(){let s=currentStudent();s.theory='待评分';state.scores[0].theory='待评分';state.messages.unshift({id:Date.now(),to:'deptAdmin',title:'理论考试待评分',body:s.name+' 已提交正式理论考试，请处理评分发布。',read:false,time:'刚刚',target:'deptGrading'});audit(s.name,'提交正式理论考试','正式考核');save();render();toast('已交卷，进入待评分');go('scores')}
function submitPractice(){let s=currentStudent();s.practice='待评分';state.scores[0].practice='待评分';state.messages.unshift({id:Date.now(),to:'deptAdmin',title:'实践成果待批阅',body:s.name+' 已提交实践成果，请进行人工复核。',read:false,time:'刚刚',target:'deptGrading'});audit(s.name,'提交实践成果','岗位 Demo');save();render();toast('实践成果已提交')}
function scores(){let rows=state.scores.map(x=>`<tr><td><b>${x.name}</b><div class="sub">${x.time}</div></td><td>${x.theory}</td><td>${x.practice}</td><td>${x.total}</td><td>${x.adminComment}</td><td>${x.rule}</td></tr>`).join('');return shell('考核成绩','按时间顺序展示正式考核，理论与实践分开统计',`<div class="table-wrap"><table class="table"><thead><tr><th>考核</th><th>理论成绩</th><th>实践成绩</th><th>综合结果</th><th>部门管理员阶段评价</th><th>规则结果</th></tr></thead><tbody>${rows}</tbody></table></div>`)}
function scoreTodos(){return state.scores.map(x=>`<div class="todo"><span><i class="pin ${x.total==='已通过'?'green':'amber'}"></i></span><div><b>${x.name}</b><div class="sub">理论：${x.theory} · 实践：${x.practice} · ${x.rule}</div></div><time>${x.total}</time></div>`).join('')}
function portrait(){let s=currentStudent();return shell('能力画像','工作台展示摘要，详情页展示来源、维度和成长轨迹',`<div class="stats">${stat('综合表现',s.portrait+'%','近 90 天')}${stat('学习投入',s.courseRate+'%','学习完成率')}${stat('理论掌握',s.theory,'正式考试')}${stat('实践能力',s.practice,'成果状态')}</div><div class="grid-2"><div class="card"><h3>能力维度</h3>${kpi('专业知识',78)}${kpi('实操技能',64)}${kpi('规范遵从',83)}${kpi('沟通协作',57)}</div><div class="card"><h3>阶段评价摘要</h3>${s.comments.map(c=>todo('blue','部门管理员阶段评价',c,'最新')).join('')}</div></div>`)}
function kpi(name,value){return `<div class="kpi-line"><span>${name}</span><div class="progress"><i style="width:${Number(value)||0}%"></i></div><b>${value}</b></div>`}
function deptDash(){let pending=state.registers.filter(x=>x.status==='待审核').length;return shell('部门管理员工作台','按本部门范围处理注册审核、导师字段维护、评分发布和阶段评价',`<div class="stats">${stat('待注册审核',pending,'需要处理',pending?'warn':'')}${stat('本部门实习生',state.students.length,'交付部门')}${stat('待批阅',state.students.filter(x=>x.theory==='待评分'||x.practice==='待评分').length,'理论 / 实践')}${stat('平均完成率',avgRate()+'%','本部门')}</div><div class="grid-2"><div class="card"><div class="card-head"><h3>待办</h3><a onclick="go('reviews')">进入审核</a></div>${todo('red','注册申请待审核',pending+' 条申请','今天')}${todo('amber','正式考核待批阅',state.students.filter(x=>x.theory==='待评分'||x.practice==='待评分').length+' 条记录','今天')}${todo('blue','阶段评价待补充','能力画像数据待完善','本周')}</div><div class="card"><h3>职责范围</h3>${todo('amber','审核通过后维护导师字段','导师字段作为实习生档案属性展示','规则')}${todo('blue','批阅发布后通知实习生','成绩状态回写工作台和消息中心','回流')}${todo('green','按本部门范围处理业务','列表、统计、评分和评价归属本部门','权限')}</div></div><div class="card" style="margin-top:14px"><div class="card-head"><h3>考核认证快捷入口</h3><a onclick="go('deptAssessment')">打开考核认证管理</a></div><div class="entry-grid">${adminModules.slice(0,4).map((m,i)=>adminEntry(String(i+1),m[1],m[2],m[0])).join('')}</div></div>`)}
function reviews(){let rows=state.registers.map(r=>`<tr><td><b>${r.name}</b><div class="sub">${r.id}</div></td><td>${maskId(r.idNo)}</td><td>${r.job}</td><td>${r.dept}</td><td>${r.eta||'非必填'}</td><td><span class="tag ${r.status==='待审核'?'amber':r.status==='已通过'?'green':'red'}">${r.status}</span></td><td>${r.mentor||'-'}</td><td><button class="btn small primary" onclick="reviewRegister('${r.id}')">审核</button></td></tr>`).join('');return shell('注册审核','核对身份证号、岗位和自动匹配部门，审核通过时维护导师字段',`<div class="table-wrap"><table class="table"><thead><tr><th>申请人</th><th>身份证号</th><th>岗位</th><th>自动匹配部门</th><th>预计入职</th><th>状态</th><th>导师字段</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div>`)}
function reviewRegister(id){let r=state.registers.find(x=>x.id===id);openModal('审核注册申请',`<div class="form-grid"><div class="field"><label>姓名</label><input value="${r.name}" disabled></div><div class="field"><label>身份证号</label><input value="${maskId(r.idNo)}" disabled></div><div class="field"><label>岗位</label><input value="${r.job}" disabled></div><div class="field"><label>部门</label><input value="${r.dept}" disabled></div><div class="field"><label>导师字段</label><select id="reviewMentor"><option>李芳</option><option>张伟</option><option>刘敏</option><option>周涛</option></select></div><div class="field"><label>审核结论</label><select id="reviewStatus"><option>已通过</option><option>已驳回</option></select></div><div class="field full"><label>审核意见</label><textarea id="reviewComment">资料核对通过，启用为预备实习生账号。</textarea></div></div>`,`<button class="btn primary" onclick="saveReview('${id}')">提交审核</button>`)}
function saveReview(id){let r=state.registers.find(x=>x.id===id);r.mentor=document.getElementById('reviewMentor').value;r.status=document.getElementById('reviewStatus').value;r.comment=document.getElementById('reviewComment').value;if(r.status==='已通过'&&!state.students.some(s=>s.name===r.name)){state.students.push({id:'S'+Date.now(),name:r.name,job:r.job,dept:r.dept,status:'预备实习生',mentor:r.mentor,protocolSigned:false,courseRate:0,theory:'未开始',practice:'未提交',finalResult:'未完成',portrait:0,comments:['导师字段已维护，请尽快完成首次登录协议签署。']});state.messages.unshift({id:Date.now(),to:'prepIntern',title:'注册审核已通过',body:'部门管理员已维护导师字段：'+r.mentor+'，请登录后签署保密协议。',read:false,time:'刚刚',target:'dashboard'});}audit(roleUser[role],'审核注册申请',r.name);closeModal();save();render();toast('审核结果已保存')}
function students(){return shell('实习生管理','部门管理员按本部门范围查看实习生，超级管理员查看全局统计但不代办具体业务',studentTable())}
function studentTable(){let rows=state.students.map(s=>`<tr><td><b>${s.name}</b><div class="sub">${s.id}</div></td><td>${s.status}</td><td>${s.dept}</td><td>${s.job}</td><td>${s.mentor}</td><td>${s.courseRate}%</td><td>${s.theory} / ${s.practice}</td><td>${s.finalResult}</td></tr>`).join('');return `<div class="table-wrap"><table class="table"><thead><tr><th>姓名</th><th>身份</th><th>部门</th><th>岗位</th><th>导师字段</th><th>学习完成率</th><th>考核状态</th><th>综合结果</th></tr></thead><tbody>${rows}</tbody></table></div>`}
function deptGrading(){let pending=state.students.filter(s=>s.theory==='待评分'||s.practice==='待评分');return shell('实习批阅','AI 初筛后由部门管理员复核，发布后回写工作台和消息中心',pending.length?`<div class="review-list">${pending.map(s=>`<div class="review-row"><div><b>${s.name}</b><div class="sub">${s.dept} · ${s.job}</div></div><div><b>理论：${s.theory}</b><div class="sub">线上答题</div></div><div><b>实践：${s.practice}</b><div class="sub">成果包</div></div><div><b>导师字段：${s.mentor}</b><div class="sub">补充阶段评价</div></div><button class="btn small primary" onclick="publishScore('${s.id}')">发布成绩</button></div>`).join('')}</div>`:`<div class="empty">当前没有待批阅记录</div>`)}
function publishScore(id){let s=state.students.find(x=>x.id===id);s.theory='72 分';s.practice='78 分';s.finalResult='已通过';s.portrait=Math.max(s.portrait,80);state.scores[0].theory='72 分';state.scores[0].practice='78 分';state.scores[0].total='已通过';state.scores[0].adminComment='实践思路清晰，建议继续加强异常处理。';state.scores[0].rule='达到通过条件';state.messages.unshift({id:Date.now(),to:'prepIntern',title:'正式考核成绩已发布',body:'理论 72 分，实践 78 分，综合结果：已通过。',read:false,time:'刚刚',target:'scores'});audit(roleUser[role],'发布正式考核成绩',s.name);save();render();toast('成绩已发布并通知实习生')}
function deptPortrait(){return shell('能力画像','先看人员列表，再进入个人画像详情并提交阶段评价',`<div class="stats">${stat('覆盖人数',state.students.length,'本部门')}${stat('平均画像',Math.round(state.students.reduce((a,b)=>a+b.portrait,0)/state.students.length)+'%','综合表现')}${stat('待评价','2','需要处理','warn')}${stat('样本不足','1','数据积累中','warn')}</div>${studentTable()}`)}
function globalDash(){return shell('超级管理员工作台','看全局、管规则、做审计，具体业务由部门管理员按部门处理',`<div class="stats">${stat('全局实习生',state.students.length+126,'全部部门')}${stat('待审核',state.registers.filter(x=>x.status==='待审核').length,'按部门下钻','warn')}${stat('协议签署率','84%','全局统计')}${stat('规则版本','V1.5','当前生效')}</div><div class="grid-2"><div class="card"><h3>全局职责</h3>${todo('blue','维护组织与岗位映射','决定注册时自动匹配部门','配置')}${todo('green','维护协议模板和系统参数','决定首次登录强签规则','规则')}${todo('amber','维护考核认证配置','八个管理入口统一配置','考核')}</div><div class="card"><h3>考核认证快捷入口</h3>${adminModules.slice(0,4).map(m=>todo('blue',m[1],m[2],'进入')).join('')}<button class="btn primary" style="margin-top:10px" onclick="go('adminAssessment')">打开考核认证管理</button></div></div>`)}
function adminAssessment(){let body=`<div class="admin-shell"><div class="admin-hero"><div><span class="tag">考核认证管理</span><h1>实习生考核认证配置中心</h1><p class="muted">超级管理员维护全局模板、规则和内容结构，部门管理员按本部门范围发布、批阅和评价。八个入口均可进入二级管理页，并通过弹窗完成三级配置动作。</p></div><button class="btn primary" onclick="saveAdminAssessment()">保存配置</button></div><div class="metric-row">${metric('考试安排',state.schedules.length+' 场','理论 / 实践分开安排','blue')}${metric('课程设计',state.materials.length+' 项','文档理论 + 视频实操','green')}${metric('题库数量',state.theoryBank.length+state.practiceBank.length+' 题','理论题库 / 实操题库','orange')}${metric('待批阅',state.students.filter(x=>x.theory==='待评分'||x.practice==='待评分').length+' 条','部门管理员处理','red')}</div><div class="entry-grid">${adminModules.map((m,i)=>adminEntry(String(i+1),m[1],m[2],m[0])).join('')}</div></div>`;return shell('考核认证管理','复制参考原型的入口式布局，并贴合实习生学习考核主题',body)}
function adminEntry(icon,title,desc,tab){return `<button class="admin-entry" onclick="go('admin_${tab}')"><span>${icon}</span><div><strong>${title}</strong><small>${desc}</small></div><b>进入配置</b></button>`}
function deptAssessment(){let body=`<div class="admin-shell"><div class="admin-hero"><div><span class="tag">考核认证管理</span><h1>本部门考核认证配置中心</h1><p class="muted">部门管理员按本部门范围维护考试安排、课程、题库、常见问题和批阅评价，八个入口与超级管理员共用同一套二级、三级页面，数据范围默认限定本部门。</p></div><button class="btn primary" onclick="saveAdminAssessment()">保存配置</button></div><div class="metric-row">${metric('本部门考试安排',state.schedules.length+' 场','理论 / 实践分开安排','blue')}${metric('本部门课程',state.materials.length+' 项','文档理论 + 视频实操','green')}${metric('本部门题库',state.theoryBank.length+state.practiceBank.length+' 题','理论题库 / 实操题库','orange')}${metric('本部门待批阅',state.students.filter(x=>x.theory==='待评分'||x.practice==='待评分').length+' 条','部门管理员处理','red')}</div><div class="entry-grid">${adminModules.map((m,i)=>adminEntry(String(i+1),m[1],m[2],m[0])).join('')}</div></div>`;return shell('考核认证管理','部门管理员按本部门范围维护考核认证业务，配置项与全局模板保持一致',body)}
function adminModule(tab){let m=adminModules.find(x=>x[0]===tab)||adminModules[0];let back=role==='deptAdmin'?'deptAssessment':'adminAssessment';let scopeTxt=role==='deptAdmin'?'（本部门范围）':'';let side=adminModules.map(x=>`<button class="btn ${x[0]===tab?'primary':'light'}" onclick="go('admin_${x[0]}')"><b>${x[1]}</b><span class="sub">${x[2]}</span></button>`).join('');return shell(m[1]+scopeTxt,m[2],`<div class="subnav"><a onclick="go('${back}')">考核认证管理</a><span>/</span><b>${m[1]}</b></div><div class="detail-grid"><aside class="detail-side">${side}</aside><section>${adminModuleBody(tab)}</section></div>`,`<button class="btn" onclick="go('${back}')">返回总览</button>`)}
function adminModuleBody(tab){if(tab==='schedule')return schedulePanel();if(tab==='course')return courseDesignPanel();if(tab==='offline')return offlinePanel();if(tab==='theory')return bankPanel('theory');if(tab==='practice')return bankPanel('practice');if(tab==='faq')return faqAdminPanel();if(tab==='internExam')return internExamRulePanel();return reviewPanel()}
function schedulePanel(){return `<div class="toolbar"><button class="btn primary" onclick="addSchedule()">新增考试安排</button><button class="btn light" onclick="openAdminDetail('考试安排详情')">配置报名与发布</button></div><div class="table-wrap"><table class="table"><thead><tr><th>考试名称</th><th>部门范围</th><th>理论考试时间</th><th>实践考核时间</th><th>状态</th><th>操作</th></tr></thead><tbody>${state.schedules.map(s=>`<tr><td>${s.name}</td><td>${s.dept}</td><td>${s.theoryDate}</td><td>${s.practiceDate}</td><td><span class="tag green">${s.status}</span></td><td><button class="btn small light" onclick="openAdminDetail('编辑考试安排')">编辑</button></td></tr>`).join('')}</tbody></table></div>`}
function addSchedule(){state.schedules.unshift({name:'新增正式考核 '+now().slice(5,10),dept:'交付部门',theoryDate:'待设置',practiceDate:'待设置',status:'草稿'});audit(roleUser[role],'新增考试安排','考核认证管理');save();render();toast('已新增考试安排')}
function courseDesignPanel(){return `<div class="toolbar"><button class="btn primary" onclick="openAdminDetail('新增课程章节')">新增课程章节</button><button class="btn light" onclick="openAdminDetail('配置完成验证')">完成验证规则</button></div><div class="grid-2"><div class="card"><h3>课程结构</h3>${state.materials.map(m=>`<div class="content-row"><span>${m.type}</span><div><b>${m.chapter}</b><small class="sub">${m.title} · ${m.type}</small></div><button class="btn small light" onclick="openAdminDetail('编辑课程')">编辑</button></div>`).join('')}</div><div class="card"><h3>完成验证规则</h3>${kpi('文档理论',state.settings.docScrollRequired?100:40)}${kpi('视频实操',state.settings.videoPercentRequired)}<p class="muted">文档理论默认要求滚动到底，视频实操默认要求观看到 100%。</p></div></div>`}
function offlinePanel(){return `<div class="toolbar"><button class="btn primary" onclick="openAdminDetail('新增线下学习场次')">新增线下学习</button><button class="btn light" onclick="openAdminDetail('导出签到记录')">导出签到</button></div><div class="grid-3">${state.offlineLessons.map(x=>`<div class="card"><h3>${x.name}</h3><p class="muted">${x.dept} · ${x.place} · ${x.time}</p><span class="tag amber">${x.status}</span><div style="margin-top:12px"><button class="btn light" onclick="openAdminDetail('签到名单')">查看签到</button></div></div>`).join('')}<div class="card"><h3>补课规则</h3><p class="muted">缺席人员在 3 个工作日内完成补课材料，完成记录进入学习档案。</p><button class="btn light" onclick="openAdminDetail('补课规则')">配置规则</button></div></div>`}
function bankPanel(type){let data=type==='theory'?state.theoryBank:state.practiceBank;let rows=data.map(x=>`<tr><td><b>${x.title}</b></td><td>${type==='theory'?x.type:x.job}</td><td>${type==='theory'?x.score+' 分':x.files}</td><td>${type==='theory'?x.point:'岗位实操'}</td><td><span class="tag green">${x.status}</span></td><td><button class="btn small light" onclick="openAdminDetail('编辑题目')">编辑</button></td></tr>`).join('');return `<div class="toolbar"><input placeholder="搜索题目、知识点或岗位"><div class="actions"><button class="btn primary" onclick="addQuestion('${type}')">新增题目</button><button class="btn" onclick="openAdminDetail('Excel 导入题库')">Excel 导入</button></div></div><div class="table-wrap"><table class="table"><thead><tr><th>题目</th><th>${type==='theory'?'题型':'适用岗位'}</th><th>${type==='theory'?'分值':'提交物'}</th><th>分类</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div>`}
function addQuestion(type){if(type==='theory')state.theoryBank.unshift({title:'新增理论题',type:'单选题',score:2,point:'岗位规范',status:'草稿'});else state.practiceBank.unshift({title:'新增实操题',job:'实施实习生',files:'文档 / 视频',status:'草稿'});audit(roleUser[role],'新增题目',type==='theory'?'理论题库':'实操题库');save();render();toast('题目已新增')}
function faqAdminPanel(){return `<div class="toolbar"><button class="btn primary" onclick="addFaq()">新增常见问题</button><button class="btn light" onclick="openAdminDetail('调整 FAQ 排序')">调整排序</button></div><div class="faq-list">${state.faqs.map((f,i)=>`<div class="faq-item"><div class="card-head"><b>${i+1}. ${f.q}</b><button class="btn small light" onclick="openAdminDetail('编辑常见问题')">编辑</button></div><p>${f.a}</p></div>`).join('')}</div>`}
function addFaq(){state.faqs.push({q:'新增问题：如何查看阶段评价？',a:'进入工作台的考核成绩或能力画像区域查看已公开的部门管理员阶段评价。'});audit(roleUser[role],'新增常见问题','考核认证管理');save();render();toast('常见问题已新增')}
function internExamRulePanel(){return `<div class="card"><div class="form-grid"><div class="field"><label>正式考核学习完成率阈值</label><input id="threshold" type="number" value="${state.settings.examThreshold}"></div><div class="field"><label>默认补考次数</label><input id="retake" type="number" value="${state.settings.retakeLimit}"></div><div class="field"><label>理论通过分</label><input id="passScore" type="number" value="${state.settings.passScore}"></div><div class="field"><label>考核结果发布</label><select><option>部门管理员确认后发布</option><option>评分完成后定时发布</option></select></div><div class="field full"><label>流程规则</label><textarea>理论考试与实践考核分别留痕，综合结果由规则聚合后进入部门管理员确认；补考、终止和转正门槛在实习生工作台和成绩详情清晰展示。</textarea></div></div><button class="btn primary" style="margin-top:12px" onclick="saveRules()">保存规则</button></div>`}
function reviewPanel(){return `<div class="toolbar"><button class="btn primary" onclick="openAdminDetail('批量发布成绩')">批量发布</button><button class="btn light" onclick="openAdminDetail('AI 初筛记录')">AI 初筛记录</button></div><div class="card"><h3>批阅队列</h3>${state.students.map(s=>`<div class="review-row"><div><b>${s.name}</b><div class="sub">${s.status} · ${s.dept}</div></div><div><b>${s.theory}</b><div class="sub">理论考试</div></div><div><b>${s.practice}</b><div class="sub">实践考核</div></div><div><b>${s.finalResult}</b><div class="sub">综合结果</div></div><button class="btn small light" onclick="openAdminDetail('查看批阅详情')">查看</button></div>`).join('')}</div>`}
function openAdminDetail(title){let scopeField=role==='deptAdmin'?'<input value="本部门 · 交付部门" disabled>':'<select><option>全部部门</option><option>交付部门</option><option>开发部门</option><option>设计部门</option></select>';openModal(title,`<div class="form-grid"><div class="field"><label>名称</label><input value="${title}"></div><div class="field"><label>适用范围</label>${scopeField}</div><div class="field full"><label>配置说明</label><textarea>这里模拟二级页面进入后的三级配置动作。实际系统保存字段、版本、操作人和更新时间，并写入审计日志。</textarea></div></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveAdminDetail('${title}')">保存</button>`)}
function saveAdminDetail(title){audit(roleUser[role],'保存配置',title);closeModal();toast('配置已保存')}
function saveAdminAssessment(){audit(roleUser[role],'保存考核认证配置','配置中心');toast('考核认证配置已保存到本地缓存')}
function org(){return shell('组织岗位','维护岗位到部门的自动映射关系',`<div class="table-wrap"><table class="table"><thead><tr><th>岗位</th><th>自动匹配部门</th><th>部门管理员</th><th>状态</th></tr></thead><tbody>${[['实施实习生','交付部门','赵宁'],['开发实习生','开发部门','张伟'],['设计实习生','设计部门','王珊'],['质检实习生','质检部门','刘敏'],['建模实习生','建模部门','周涛']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td><span class="tag green">启用</span></td></tr>`).join('')}</tbody></table></div>`)}
function permissions(){return shell('角色权限','固定角色和数据范围保持明确',`<div class="grid-2"><div class="card"><h3>角色</h3>${Object.values(roles).map(x=>todo('blue',x,'固定角色，按业务职责授权','锁定')).join('')}</div><div class="card"><h3>数据范围</h3>${todo('green','超级管理员','全局可见，负责规则和审计','全局')}${todo('amber','部门管理员','本部门数据，处理具体业务','本部门')}${todo('blue','预备 / 正式实习生','本人数据和本人消息','个人')}</div></div>`)}
function rules(){return shell('系统规则','配置默认考核门槛，修改后写入缓存并影响实习生端资格判断',internExamRulePanel())}
function saveRules(){state.settings.examThreshold=Number(document.getElementById('threshold').value||70);state.settings.retakeLimit=Number(document.getElementById('retake').value||1);let ps=document.getElementById('passScore');if(ps)state.settings.passScore=Number(ps.value||70);audit(roleUser[role],'修改系统规则','考核资格与补考规则');save();render();toast('规则已保存并影响前台判断')}
function messages(){let list=byRoleMessages();return shell('消息中心','侧边栏和顶部双入口共用同一消息数据源',`<div class="toolbar"><button class="btn primary" onclick="markAllRead()">全部已读</button><button class="btn" onclick="addDemoMessage()">新增演示消息</button></div><div class="card">${list.length?list.map(m=>`<div class="todo"><span><i class="pin ${m.read?'green':'red'}"></i></span><div><b>${m.title}</b><div class="sub">${m.body}</div></div><time>${m.time}</time><button class="btn small" onclick="openMessage(${m.id})">查看</button></div>`).join(''):'<div class="empty">暂无消息</div>'}</div>`)}
function openMessage(id){let m=state.messages.find(x=>x.id===id);m.read=true;save();toast('消息已读');if(m.target&&routes[m.target])go(m.target);else render()}
function markAllRead(){byRoleMessages().forEach(m=>m.read=true);save();render();toast('已全部标记为已读')}
function addDemoMessage(){state.messages.unshift({id:Date.now(),to:role,title:'演示消息',body:'这是一条写入 localStorage 的假数据消息。',read:false,time:'刚刚',target:page});save();render();toast('消息已生成')}
function profile(){let s=currentStudent();return shell('个人信息','个人中心收敛到头像入口，保密协议和证书在工作台展示',`<div class="grid-2"><div class="card"><h3>基础信息</h3><div class="form-grid"><div class="field"><label>姓名</label><input value="${s.name}"></div><div class="field"><label>身份证号</label><input value="130102********2318"></div><div class="field"><label>部门</label><input value="${s.dept}" disabled></div><div class="field"><label>岗位</label><input value="${s.job}" disabled></div><div class="field"><label>导师字段</label><input value="${s.mentor}" disabled></div><div class="field"><label>账号状态</label><input value="${s.status}" disabled></div></div></div><div class="card" id="pwdCard"><h3>密码修改</h3><div class="form-grid"><div class="field full"><label>原密码</label><input type="password"></div><div class="field full"><label>新密码</label><input type="password"></div><div class="field full"><label>确认新密码</label><input type="password"></div></div><button class="btn primary" style="margin-top:12px" onclick="toast('密码修改已写入演示日志')">保存密码</button></div></div>`)}
function auditPage(){return shell('审计日志','所有关键动作写入本地假数据日志',`<div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>操作人</th><th>动作</th><th>对象</th></tr></thead><tbody>${state.audit.map(a=>`<tr><td>${a.time}</td><td>${a.actor}</td><td>${a.action}</td><td>${a.target}</td></tr>`).join('')}</tbody></table></div>`)}
function openProtocol(){openModal('首次登录保密协议签署',`<p class="muted">首次登录完成签署后进入业务功能。PC 端可鼠标签名，手机端可手写签名。</p><div class="reader"><h3>实习生保密协议 V1.2</h3><p>协议正文用于约束学习、考核、资料、账号和项目交付过程中的保密责任。</p><p>系统记录签署人、账号、协议版本、签署时间、IP 和签署凭证。</p></div><div class="sig-pad" id="sigPad" onclick="this.textContent='已完成签名';this.dataset.signed='1'">点击此区域模拟签名</div>`,`<button class="btn primary" onclick="signProtocol()">确认签署</button>`)}
function signProtocol(){let pad=document.getElementById('sigPad');if(!pad.dataset.signed){toast('请先完成签名');return}currentStudent().protocolSigned=true;state.messages.unshift({id:Date.now(),to:role,title:'保密协议签署成功',body:'签署记录已生成，可在工作台材料与证书区域查看。',read:false,time:'刚刚',target:'dashboard'});audit(currentStudent().name,'签署保密协议','实习生保密协议 V1.2');save();closeModal();render();toast('协议已签署')}
function openStudyGuide(){openModal('考试指南',`<div class="reader"><h3>正式考核规则</h3><p>学习完成率达到 ${state.settings.examThreshold}% 后，可参加正式理论考试和实践考核。</p><p>理论考试默认随机抽取 10 题，实践考核按岗位提交 Demo、说明文档和演示材料。</p><p>理论考试与实践考核分开统计，综合结果发布后进入成绩详情和能力画像。</p></div>`,`<button class="btn primary" onclick="closeModal()">知道了</button>`)}
function openMaterialPage(id){state.ui.materialId=id;save();go('material')}
function materialPage(){let m=state.materials.find(x=>x.id===state.ui.materialId)||state.materials[0];let isDoc=m.type==='文档理论';return shell('学习详情：'+m.title,`${m.chapter} · ${m.type} · ${m.done?'已完成':'学习中'}`,`<div class="grid-2"><div class="card"><div class="reader"><h3>${m.title}</h3><p>这里模拟学习正文页面。实际系统中接入文档预览、视频播放、阅读进度、完成时间和审计日志。</p><p>文档理论材料必须阅读到末尾后才能完成，视频实操材料需要记录播放进度。</p><p>本段位于末尾。通过右侧完成验证后可标记完成。</p></div><div class="sub" style="margin-top:10px" id="materialTip">${isDoc?'请滚动到文档末尾。':'请观看到要求进度。'}</div></div><div class="card"><h3>完成规则</h3>${kpi('当前进度',m.progress)}<p class="muted">${isDoc?'文档完成验证：必须滚动到底。':'视频完成验证：观看进度达到 '+state.settings.videoPercentRequired+'%。'}</p><div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">${m.done?'<span class="tag green">已完成 · '+(m.doneAt||'')+'</span>':`<button class="btn light" ${m.progress>=100?'disabled':''} onclick="passMaterialCheck('${m.id}')">模拟已${isDoc?'滚动到底':'观看完成'}</button><button class="btn primary" id="finishBtn" ${m.progress>=100?'':'disabled'} onclick="finishMaterial('${m.id}')">标记完成</button>`}</div><button class="btn light" style="margin-top:14px" onclick="go('learning')">返回学习材料</button></div></div>`)}
function studyGuidePage(){return shell('备考资料','考试指南、考核规则与模拟考试自测',`<div class="grid-2"><div class="card"><div class="reader"><h3>正式考核规则</h3><p>学习完成率达到 ${state.settings.examThreshold}% 后，可参加正式理论考试和实践考核。</p><p>理论考试默认随机抽取 10 题，题型包含单选题、多选题和判断题，线上限时答题。</p><p>实践考核按岗位提交 Demo、说明文档和演示材料，评分方式为 AI 初筛 + 人工复核。</p><p>理论考试与实践考核分开统计，综合结果发布后进入成绩详情和能力画像。</p></div></div><div><div class="card"><h3>考核要点分布</h3><div class="knowledge-grid"><div>岗位规范 <b>20%</b></div><div>流程制度 <b>20%</b></div><div>交付标准 <b>20%</b></div><div>安全保密 <b>20%</b></div><div>实操规则 <b>20%</b></div></div><p class="muted" style="margin-top:12px">补考次数默认 ${state.settings.retakeLimit} 次，规则由部门管理员按部门维护。</p></div><div class="card" style="margin-top:14px"><div class="card-head"><h3>模拟考试</h3><span class="tag blue">自测练习</span></div><p class="muted">题库随机抽取 10 题，不限时长，提交后立即显示自测结果与错题回顾，不计入正式考核成绩、不通知部门管理员。</p><button class="btn primary" style="margin-top:12px" onclick="go('mockExam')">开始模拟考试</button></div></div></div>`)}
function mockExamPage(){let done=state.ui.mockDone;if(done){return shell('模拟考试 · 自测结果','模拟考试成绩不计入正式考核，可反复练习',`<div class="stats">${stat('答题数量','10 题','随机抽取')}${stat('自测得分','80 / 100','对照题库答案自动判分')}${stat('用时','14 分钟','不限时长')}${stat('建议','重点复习考核规则','错题已标注')}</div><div class="card"><h3>错题回顾</h3>${todo('red','学习完成率阈值判断（多选题）','漏选“视频实操进度要求”选项','错题')}${todo('amber','保密协议签署规则（单选题）','签署凭证包含项记忆不准确','错题')}</div><div style="margin-top:14px;display:flex;gap:10px"><button class="btn primary" onclick="resetMock()">再测一轮</button><button class="btn light" onclick="go('studyGuide')">查看考试指南</button></div>`)}return shell('模拟考试','题库随机抽取 10 题 · 不限时长 · 自测练习不计入正式考核成绩',`<div class="grid-2"><div><div class="card"><h3>1. 模拟考试的作用是什么？</h3><p><label><input type="radio" name="mq1" checked> 熟悉题型与检验学习效果</label></p><p><label><input type="radio" name="mq1"> 直接获得正式成绩</label></p></div><div class="card" style="margin-top:12px"><h3>2. 正式理论考试的抽题方式是？</h3><p><label><input type="radio" name="mq2" checked> 题库随机抽取 10 题</label></p></div><div class="card" style="margin-top:12px"><h3>3. 文档理论完成验证要求是？</h3><p><label><input type="radio" name="mq3" checked> 滚动阅读到文档末尾</label></p></div></div><div><div class="card"><h3>答题卡</h3><div class="answer-sheet">${Array.from({length:10},(_,i)=>`<span class="${i<3?'done':''}">${i+1}</span>`).join('')}</div><p class="muted" style="margin-top:12px">模拟考试不限时长、不通知部门管理员、不写入正式成绩，提交后立即显示自测结果与错题回顾。</p></div></div></div>`,`<button class="btn" onclick="go('studyGuide')">返回备考资料</button><button class="btn primary" onclick="submitMock()">提交自测</button>`)}
function submitMock(){state.ui.mockDone=true;save();render();toast('自测完成，结果仅供练习参考')}
function resetMock(){state.ui.mockDone=false;save();render();toast('已重新抽题')}
function taskCenter(){let tab=state.ui.taskTab||'todo';let list=state.tasks.filter(t=>tab==='done'?t.status==='已完成':t.status!=='已完成');let rows=list.map(t=>`<tr><td><b>${t.title}</b><div class="sub">${t.id} · ${t.type}</div></td><td>${t.due}</td><td><span class="tag ${t.status==='已完成'?'green':t.status==='进行中'?'blue':'amber'}">${t.status}</span></td><td><button class="btn small light" onclick="go('${t.target}')">去处理</button></td></tr>`).join('');let todo_=state.tasks.filter(t=>t.status!=='已完成').length;return shell('任务中心','学习、协议、考试、线下学习等任务统一管理，完成后状态自动流转',`<div class="stats">${stat('待办任务',todo_,'按截止时间排序','warn')}${stat('进行中',state.tasks.filter(t=>t.status==='进行中').length,'尽快完成')}${stat('已完成',state.tasks.filter(t=>t.status==='已完成').length,'计入学习记录')}${stat('本周期任务',state.tasks.length,'全部类型')}</div><div class="tabs"><button class="tab ${tab==='todo'?'active':''}" onclick="setTaskTab('todo')">待办 / 进行中</button><button class="tab ${tab==='done'?'active':''}" onclick="setTaskTab('done')">已完成</button></div><div class="table-wrap"><table class="table"><thead><tr><th>任务</th><th>截止时间</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="muted" style="padding:18px">暂无任务</td></tr>'}</tbody></table></div>`)}
function setTaskTab(v){state.ui.taskTab=v;save();render()}
function taskSummary(){let list=state.tasks.filter(t=>t.status!=='已完成').slice(0,3);return `<div class="card"><div class="card-head"><h3>任务中心</h3><a onclick="go('taskCenter')">进入详情页</a></div>${list.map(t=>todo(t.status==='进行中'?'blue':'amber',t.title,t.type+' · 截止 '+t.due,t.status)).join('')||'<div class="empty">暂无待办任务</div>'}</div>`}
function certificates(){let s=currentStudent();let tab=state.ui.certTab||'protocol';let protocolCard=`<div class="card"><div class="card-head"><h3>保密协议</h3><span class="tag ${s.protocolSigned?'green':'amber'}">${s.protocolSigned?'已签署':'待签署'}</span></div>${s.protocolSigned?`<div class="kv"><span>协议版本</span><b>实习生保密协议 V1.2</b></div><div class="kv"><span>签署人</span><b>${s.name}</b></div><div class="kv"><span>账号</span><b>${s.id}</b></div><div class="kv"><span>签署时间</span><b>2026-09-06 10:24</b></div><div style="margin-top:12px;display:flex;gap:10px"><button class="btn light" onclick="openProtocolReader()">查看协议全文</button><button class="btn light" onclick="toast('下载记录已写入演示日志')">下载签署凭证</button></div>`:`<p class="muted">首次登录需完成签字版签署后进入学习和考核流程，支持 PC 鼠标签名和手机端手写签名。</p><button class="btn primary" style="margin-top:12px" onclick="openProtocol()">立即签署</button>`}</div>`;let certCard=s.finalResult==='已通过'?`<div class="card"><div class="card-head"><h3>电子证书</h3><span class="tag green">已生成</span></div><div class="cert-preview"><b>实习考核合格证书</b><p>${s.name} · ${s.job} · ${s.dept}</p><div class="sub">理论 ${s.theory} · 实践 ${s.practice} · 综合结果：已通过</div></div><div style="display:flex;gap:10px"><button class="btn light" onclick="toast('证书下载已写入演示日志')">下载证书</button><button class="btn light" onclick="toast('证书校验码已复制')">校验真伪</button></div></div>`:`<div class="card"><div class="card-head"><h3>电子证书</h3><span class="tag amber">未获得</span></div><p class="muted">通过正式考核并完成转正审批后自动生成电子证书，生成后可在工作台底部「电子证书」标签点击查看。</p></div>`;return shell('材料与证书','保密协议签署记录与电子证书集中查看和下载',`<div class="tabs"><button class="tab ${tab==='protocol'?'active':''}" onclick="setCertTab('protocol')">保密协议</button><button class="tab ${tab==='certificate'?'active':''}" onclick="setCertTab('certificate')">电子证书</button></div>${tab==='protocol'?protocolCard:certCard}`)}
function setCertTab(v){state.ui.certTab=v;save();render()}
function openProtocolReader(){openModal('实习生保密协议 V1.2',`<div class="reader"><h3>实习生保密协议 V1.2</h3><p>协议正文用于约束学习、考核、资料、账号和项目交付过程中的保密责任。</p><p>系统记录签署人、账号、协议版本、签署时间、IP 和签署凭证。</p></div>`,'<button class="btn primary" onclick="closeModal()">关闭</button>')}
function toggleFaqMore(){toast('更多 FAQ 由超级管理员在考核认证管理中维护')}
function todo(cls,title,desc,time){return `<div class="todo"><span><i class="pin ${cls}"></i></span><div><b>${title}</b><div class="sub">${desc}</div></div><time>${time}</time></div>`}
function maskId(id){return id.slice(0,6)+'********'+id.slice(-4)}
function avgRate(){return Math.round(state.students.reduce((a,b)=>a+b.courseRate,0)/state.students.length)}
function openModal(title,body,foot){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalFoot').innerHTML=foot||'<button class="btn" onclick="closeModal()">关闭</button>';document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function toast(text){let el=document.getElementById('toast');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
function notFound(){return shell('页面不存在','当前角色没有这个入口',`<div class="empty">请选择左侧菜单继续。</div>`)}
function afterRender(){renderNav();renderTop()}
const routes={dashboard,assessment,learning,exam,theoryExam:theoryExamPage,mockExam:mockExamPage,taskCenter,scores,portrait,messages,profile,material:materialPage,certificates,studyGuide:studyGuidePage,deptDash,reviews,students,deptAssessment,deptGrading,deptPortrait,globalDash,adminAssessment,org,permissions,rules,audit:auditPage};
save();render();document.addEventListener('click',closeUserMenu);
</script>
</body>
